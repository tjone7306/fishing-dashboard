<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<h1>Copperstate bubble — render test</h1>
<p>This page stubs the sale JSON to an ACTIVE sale so the real widget renders. It is not linked anywhere and is deleted after verification.</p>
<script>
  // Stub fetch for the sale JSON only, so the real widget exercises its full path.
  var _f = window.fetch.bind(window);
  window.fetch = function(u, o){
    if (String(u).indexOf("copperstate-sale.json") !== -1) {
      var body = JSON.stringify({active:true, percent:20, headline:"Fourth of July Sale",
        holiday:"Fourth of July", end:"2099-07-07", url:"https://copperstatetackle.com", updated:"2026-06-29"});
      return Promise.resolve(new Response(body, {status:200, headers:{"Content-Type":"application/json"}}));
    }
    return _f(u, o);
  };
</script>
<script src="cst-sale-bubble.js" defer></script>
</body></html>
